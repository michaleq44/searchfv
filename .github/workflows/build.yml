name: Build and Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libpugixml-dev \
            build-essential \
            cmake \
            ninja-build

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -GNinja

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release

      - name: Package (just the binary)
        run: |
          mkdir searchfv-linux
          cp ${{ env.BUILD_DIR }}/appsearchfv searchfv-linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: searchfv-linux
          path: searchfv-linux

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Restore vcpkg Cache
        uses: actions/cache@v6
        with:
          path: $VCPKG_INSTALLATION_ROOT/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt'
          install-deps: 'true'
          set-env: 'true'

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -G "Ninja"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package
        run: |
          mkdir dist
          copy build\appsearchfv.exe dist\
          copy build\pugixml.dll dist\
          windeployqt --release --qmldir . dist/appsearchfv.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: searchfv-windows
          path: dist/


  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          install-deps: 'true'

      - name: Install pugixml via Homebrew
        run: |
          brew install pugixml

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -GNinja

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release

      - name: Bundle macOS app
        run: |
          mkdir searchfv-macos
          # If your binary is built as an app bundle, it's usually appsearchfv.app
          # Otherwise, we create a bundle manually.
          # The standard Qt build creates an app bundle if MACOSX_BUNDLE is TRUE.
          cp -R ${{ env.BUILD_DIR }}/appsearchfv.app searchfv-macos/
          macdeployqt6 searchfv-macos/appsearchfv.app -always-overwrite -appstore-compliant
          # pugixml is not bundled by macdeployqt; copy it manually
          # Find the dylib path
          PUGIXML_PATH=$(brew --prefix pugixml)/lib/libpugixml.dylib
          mkdir -p searchfv-macos/appsearchfv.app/Contents/Frameworks
          cp $PUGIXML_PATH searchfv-macos/appsearchfv.app/Contents/Frameworks/
          # Fix rpath
          install_name_tool -change $PUGIXML_PATH @rpath/libpugixml.dylib searchfv-macos/appsearchfv.app/Contents/MacOS/appsearchfv

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: searchfv-macos
          path: searchfv-macos